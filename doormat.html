<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CSS屋外用玄関マット</title>
    <style>
      :root {
        --brown: #9a5a35;
        --green: #3fa877;
        --pink: #d77fce;
        --gap: #e9e7e0;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #6f6a63;
        padding: 16px;
        box-sizing: border-box;
      }

      .mat {
        width: min(100%, 560px);
        aspect-ratio: 500 / 290;
        padding: 7px;
        box-sizing: border-box;
        border-radius: 8px;
        background: linear-gradient(
          135deg,
          #f4f4f4,
          #9d9d9d 30%,
          #e6e6e6 55%,
          #8a8a8a 80%,
          #d8d8d8
        );
        box-shadow:
          0 6px 18px rgba(0, 0, 0, 0.35),
          inset 0 0 0 1px rgba(0, 0, 0, 0.25);
      }

      .field {
        position: relative;
        height: 100%;
        display: grid;
        grid-template: 1fr 1fr / 1fr 1fr;
        border-radius: 3px;
        overflow: hidden;
        background: var(--gap);
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.3);
      }
      .field i {
        background: linear-gradient(
          to top left,
          var(--brown) 0 5%,
          transparent 5% 7.5%,
          var(--pink) 7.5% 14%,
          transparent 14% 16.5%,
          var(--brown) 16.5% 23%,
          transparent 23% 25.5%,
          var(--green) 25.5% 32%,
          transparent 32% 34.5%,
          var(--brown) 34.5% 41%,
          transparent 41% 43.5%,
          var(--green) 43.5% 50%,
          transparent 50% 52.5%,
          var(--brown) 52.5% 59%,
          transparent 59% 61.5%,
          var(--green) 61.5% 68%,
          transparent 68% 70.5%,
          var(--brown) 70.5% 77%,
          transparent 77% 79.5%,
          var(--green) 79.5% 86%,
          transparent 86% 88.5%,
          var(--brown) 88.5% 95%,
          transparent 95% 97.5%,
          var(--green) 97.5% 100%
        );
      }
      .field i:nth-child(2) {
        transform: scaleX(-1);
      }
      .field i:nth-child(3) {
        transform: scaleY(-1);
      }
      .field i:nth-child(4) {
        transform: scale(-1);
      }

      .field::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(
              circle at 50% 50%,
              rgba(255, 255, 255, 0.35) 0 1px,
              transparent 1.6px
            )
            0 0 / 5px 5px,
          repeating-linear-gradient(
            45deg,
            rgba(0, 0, 0, 0.22) 0 1px,
            transparent 1px 5px
          ),
          repeating-linear-gradient(
            -45deg,
            rgba(0, 0, 0, 0.22) 0 1px,
            transparent 1px 5px
          );
        mix-blend-mode: multiply;
      }
    </style>
  </head>
  <body>
    <div class="mat">
      <div class="field"><i></i><i></i><i></i><i></i></div>
    </div>
  </body>
</html>
